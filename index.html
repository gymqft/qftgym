<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GYMQFT</title>

<style>
:root{
    --bg:#f7f7f7;
    --white:#fff;
    --soft:#f1f1f1;
    --text:#111;
    --muted:#777;
    --border:#e6e6e6;
    --danger:#d83c3c;
    --shadow:0 18px 55px rgba(0,0,0,.08);
    --radius:18px;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

button:active{
    transform:scale(.97);
}

img{
    max-width:100%;
}

.hidden{
    display:none!important;
}

.icon{
    width:20px;
    height:20px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
}

/* HEADER */

.header{
    position:sticky;
    top:0;
    z-index:1000;
    height:74px;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(0,0,0,.06);
    transition:.3s;
}

.header.scrolled{
    box-shadow:0 8px 35px rgba(0,0,0,.06);
}

.nav{
    height:100%;
    max-width:1450px;
    margin:auto;
    padding:0 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logoButton{
    border:0;
    background:transparent;
    padding:0;
    display:flex;
    align-items:center;
}

.logo{
    max-width:175px;
    max-height:44px;
    object-fit:contain;
    transition:.3s;
}

.logoButton:hover .logo{
    transform:scale(1.04);
}

.navActions{
    display:flex;
    align-items:center;
    gap:5px;
}

.iconButton{
    position:relative;
    width:44px;
    height:44px;
    border:1px solid transparent;
    background:transparent;
    border-radius:13px;
    display:grid;
    place-items:center;
    color:#111;
    transition:.25s;
}

.iconButton:hover{
    background:#f2f2f2;
    border-color:#e3e3e3;
    transform:translateY(-2px);
}

.badge{
    position:absolute;
    right:2px;
    top:2px;
    min-width:17px;
    height:17px;
    padding:0 4px;
    border-radius:99px;
    background:#111;
    color:#fff;
    font-size:9px;
    font-weight:700;
    display:grid;
    place-items:center;
}

/* SHOP */

.shop{
    max-width:1450px;
    margin:auto;
    padding:43px 28px 100px;
    animation:pageIn .5s ease;
}

.shopTop{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:28px;
}

.shopTitle{
    margin:0;
    font-size:28px;
    letter-spacing:-.7px;
}

.filters{
    display:flex;
    gap:7px;
}

.filter{
    border:1px solid var(--border);
    background:#fff;
    color:#777;
    padding:9px 15px;
    border-radius:99px;
    transition:.25s;
}

.filter:hover{
    color:#111;
    border-color:#ccc;
}

.filter.active{
    color:#fff;
    background:#111;
    border-color:#111;
}

/* PRODUCTS */

.products{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:24px;
}

.product{
    background:#fff;
    border:1px solid var(--border);
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 4px 18px rgba(0,0,0,.025);
    transition:
        transform .4s cubic-bezier(.2,.8,.2,1),
        box-shadow .4s,
        border-color .3s;
    animation:productIn .5s both;
}

.product:hover{
    transform:translateY(-7px);
    box-shadow:var(--shadow);
    border-color:#d6d6d6;
}

.productImage{
    position:relative;
    aspect-ratio:1/1;
    background:#eee;
    overflow:hidden;
}

.productImage img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform .65s cubic-bezier(.2,.8,.2,1);
}

.product:hover .productImage img{
    transform:scale(1.055);
}

.favoriteButton{
    position:absolute;
    right:14px;
    top:14px;
    width:43px;
    height:43px;
    border:1px solid rgba(0,0,0,.08);
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(12px);
    border-radius:50%;
    display:grid;
    place-items:center;
    transition:.25s;
}

.favoriteButton:hover{
    transform:scale(1.08);
}

.favoriteButton.active{
    color:#fff;
    background:#111;
}

.favoriteButton.active .icon{
    fill:#fff;
}

.productInfo{
    padding:21px;
}

.productName{
    font-size:18px;
    font-weight:700;
}

.productDescription{
    min-height:40px;
    margin-top:7px;
    color:#888;
    font-size:13px;
    line-height:1.5;
}

.priceLine{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-top:20px;
}

.price{
    font-size:18px;
    font-weight:700;
}

.oldPrice{
    color:#999;
    text-decoration:line-through;
    margin-right:6px;
    font-size:13px;
}

.addButton{
    border:0;
    background:#111;
    color:#fff;
    padding:11px 15px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-weight:700;
    transition:.25s;
}

.addButton:hover{
    background:#292929;
    transform:translateY(-2px);
    box-shadow:0 9px 23px rgba(0,0,0,.14);
}

/* DRAWER */

.overlay{
    position:fixed;
    inset:0;
    z-index:2000;
    background:rgba(0,0,0,.28);
    backdrop-filter:blur(5px);
    opacity:0;
    pointer-events:none;
    transition:.3s;
}

.overlay.open{
    opacity:1;
    pointer-events:auto;
}

.cartDrawer{
    position:fixed;
    z-index:2100;
    right:0;
    top:0;
    width:min(510px,100%);
    height:100vh;
    background:#fff;
    box-shadow:-20px 0 70px rgba(0,0,0,.12);
    transform:translateX(110%);
    transition:transform .42s cubic-bezier(.2,.8,.2,1);
    display:flex;
    flex-direction:column;
}

.cartDrawer.open{
    transform:translateX(0);
}

.drawerHeader{
    height:74px;
    padding:0 20px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.drawerTitle{
    font-size:18px;
    font-weight:700;
}

.drawerContent{
    flex:1;
    overflow:auto;
    padding:20px;
}

.drawerBottom{
    padding:20px;
    border-top:1px solid var(--border);
    background:#fff;
}

.totalLine{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:19px;
    margin-bottom:15px;
}

.cartItem{
    display:flex;
    gap:13px;
    padding:14px 0;
    border-bottom:1px solid var(--border);
    animation:itemIn .25s ease;
}

.cartImage{
    width:78px;
    height:78px;
    flex:none;
    border-radius:13px;
    object-fit:cover;
    background:#eee;
}

.cartInfo{
    flex:1;
    min-width:0;
}

.cartName{
    font-weight:700;
}

.cartPrice{
    color:#777;
    font-size:13px;
    margin-top:4px;
}

.cartControls{
    display:flex;
    align-items:center;
    gap:7px;
    margin-top:10px;
}

.quantityButton{
    width:29px;
    height:29px;
    border:1px solid var(--border);
    background:#fafafa;
    border-radius:8px;
    display:grid;
    place-items:center;
}

.quantityButton:hover{
    background:#eee;
}

.removeButton{
    margin-left:auto;
    width:31px;
    height:31px;
    border:1px solid #f1dada;
    color:var(--danger);
    background:#fff7f7;
    border-radius:8px;
    display:grid;
    place-items:center;
}

.removeButton:hover{
    background:#ffe9e9;
}

/* BUTTONS */

.primary{
    width:100%;
    border:0;
    background:#111;
    color:#fff;
    border-radius:12px;
    padding:14px 18px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    transition:.25s;
}

.primary:hover{
    background:#292929;
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(0,0,0,.12);
}

.secondary{
    width:100%;
    border:1px solid var(--border);
    background:#fff;
    color:#111;
    border-radius:12px;
    padding:13px 18px;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    transition:.25s;
}

.secondary:hover{
    background:#f4f4f4;
}

.smallButton{
    border:1px solid var(--border);
    background:#fff;
    color:#111;
    border-radius:9px;
    padding:9px 12px;
    display:inline-flex;
    align-items:center;
    gap:7px;
    transition:.2s;
}

.smallButton:hover{
    background:#f1f1f1;
}

.dangerButton{
    border:1px solid #f0d5d5;
    background:#fff7f7;
    color:var(--danger);
    border-radius:9px;
    padding:9px 12px;
    display:inline-flex;
    align-items:center;
    gap:7px;
    transition:.2s;
}

.dangerButton:hover{
    background:#ffe9e9;
}

/* PAGES */

.page{
    max-width:1050px;
    margin:auto;
    padding:60px 28px 100px;
    animation:pageIn .4s ease;
}

.pageTitle{
    margin:0 0 30px;
    font-size:39px;
    letter-spacing:-1px;
}

.panel{
    background:#fff;
    border:1px solid var(--border);
    border-radius:19px;
    padding:25px;
    box-shadow:0 4px 20px rgba(0,0,0,.025);
    margin-bottom:18px;
}

.field{
    margin-bottom:17px;
}

.field label{
    display:block;
    color:#777;
    font-size:13px;
    margin-bottom:8px;
}

.field input,
.field textarea,
.field select{
    width:100%;
    border:1px solid var(--border);
    background:#fafafa;
    color:#111;
    border-radius:11px;
    padding:13px 14px;
    outline:none;
    transition:.2s;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
    background:#fff;
    border-color:#aaa;
    box-shadow:0 0 0 4px rgba(0,0,0,.035);
}

.field textarea{
    min-height:100px;
    resize:vertical;
}

/* ACCOUNT */

.accountBox{
    max-width:480px;
    margin:auto;
}

.accountTabs{
    display:flex;
    gap:5px;
    padding:5px;
    background:#ededed;
    border-radius:12px;
    margin-bottom:18px;
}

.accountTab{
    flex:1;
    border:0;
    background:transparent;
    color:#777;
    padding:11px;
    border-radius:9px;
}

.accountTab.active{
    background:#fff;
    color:#111;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
}

/* CHECKOUT */

.checkoutGrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.summaryItem{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:11px 0;
    border-bottom:1px solid var(--border);
    color:#666;
}

/* ADMIN */

.admin{
    max-width:1450px;
    margin:auto;
    padding:55px 28px 100px;
    animation:pageIn .4s ease;
}

.adminTitle{
    font-size:40px;
    margin:0 0 30px;
    letter-spacing:-1px;
}

.adminGrid{
    display:grid;
    grid-template-columns:250px 1fr;
    gap:20px;
}

.adminMenu{
    height:max-content;
    background:#fff;
    border:1px solid var(--border);
    border-radius:17px;
    padding:8px;
}

.adminMenu button{
    width:100%;
    border:0;
    background:transparent;
    color:#777;
    border-radius:10px;
    padding:13px;
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    transition:.2s;
}

.adminMenu button:hover,
.adminMenu button.active{
    background:#f1f1f1;
    color:#111;
}

.adminContent{
    min-height:400px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:19px;
    padding:25px;
}

.adminProducts{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
}

.adminProduct{
    background:#fafafa;
    border:1px solid var(--border);
    border-radius:15px;
    padding:13px;
    transition:.25s;
}

.adminProduct:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 30px rgba(0,0,0,.05);
}

.adminProduct img{
    width:100%;
    aspect-ratio:16/10;
    object-fit:cover;
    border-radius:11px;
    background:#eee;
}

.adminActions{
    display:flex;
    gap:7px;
    margin-top:13px;
}

.order{
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px;
    margin-bottom:12px;
    transition:.25s;
}

.order:hover{
    box-shadow:0 10px 30px rgba(0,0,0,.05);
}

.orderTop{
    display:flex;
    justify-content:space-between;
    gap:15px;
}

.orderMeta{
    color:#888;
    font-size:13px;
    line-height:1.7;
    margin-top:5px;
}

.orderItems{
    margin-top:15px;
    padding-top:13px;
    border-top:1px solid var(--border);
}

/* SUCCESS */

.success{
    text-align:center;
    padding:85px 20px;
}

.successIcon{
    width:72px;
    height:72px;
    margin:0 auto 22px;
    border-radius:50%;
    background:#111;
    color:#fff;
    display:grid;
    place-items:center;
    animation:successPop .55s cubic-bezier(.2,1.5,.4,1);
}

.successIcon .icon{
    width:30px;
    height:30px;
}

.success h2{
    font-size:39px;
    margin:0 0 10px;
}

.success p{
    color:#777;
}

/* EMPTY */

.empty{
    width:100%;
    padding:55px 20px;
    text-align:center;
    color:#888;
    background:#fff;
    border:1px solid var(--border);
    border-radius:18px;
    grid-column:1/-1;
}

/* MODAL */

.modalLayer{
    position:fixed;
    inset:0;
    z-index:4000;
    background:rgba(0,0,0,.3);
    backdrop-filter:blur(6px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modalLayer.open{
    display:flex;
}

.modal{
    width:min(430px,100%);
    background:#fff;
    border-radius:20px;
    border:1px solid var(--border);
    box-shadow:0 30px 100px rgba(0,0,0,.16);
    padding:25px;
    animation:modalIn .25s ease;
}

.modal h3{
    margin:0 0 8px;
}

.modal p{
    color:#777;
    line-height:1.5;
    font-size:14px;
}

.modalActions{
    display:flex;
    gap:8px;
    margin-top:22px;
}

.modalActions button{
    flex:1;
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:27px;
    z-index:6000;
    background:#111;
    color:#fff;
    padding:13px 18px;
    border-radius:12px;
    font-size:13px;
    box-shadow:0 15px 40px rgba(0,0,0,.18);
    transform:translate(-50%,30px);
    opacity:0;
    pointer-events:none;
    transition:.35s cubic-bezier(.2,.8,.2,1);
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* FOOTER */

footer{
    background:#fff;
    border-top:1px solid var(--border);
    color:#aaa;
    text-align:center;
    padding:30px;
    font-size:12px;
}

/* ANIMATIONS */

@keyframes pageIn{
    from{
        opacity:0;
        transform:translateY(14px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes productIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes itemIn{
    from{
        opacity:0;
        transform:translateX(15px);
    }
    to{
        opacity:1;
        transform:translateX(0);
    }
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:scale(.94) translateY(10px);
    }
    to{
        opacity:1;
        transform:scale(1) translateY(0);
    }
}

@keyframes successPop{
    from{
        opacity:0;
        transform:scale(.4);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

/* MOBILE */

@media(max-width:950px){

    .products{
        grid-template-columns:repeat(2,1fr);
    }

    .adminGrid{
        grid-template-columns:1fr;
    }

    .checkoutGrid{
        grid-template-columns:1fr;
    }
}

@media(max-width:620px){

    .header{
        height:68px;
    }

    .nav{
        padding:0 14px;
    }

    .logo{
        max-width:135px;
        max-height:38px;
    }

    .iconButton{
        width:40px;
        height:40px;
    }

    .shop{
        padding:30px 15px 70px;
    }

    .shopTop{
        align-items:flex-start;
        flex-direction:column;
        gap:15px;
    }

    .products{
        grid-template-columns:1fr;
        gap:15px;
    }

    .page,
    .admin{
        padding:40px 15px 70px;
    }

    .pageTitle,
    .adminTitle{
        font-size:31px;
    }

    .adminProducts{
        grid-template-columns:1fr;
    }

    .filters{
        width:100%;
        overflow:auto;
    }

    .filter{
        white-space:nowrap;
    }
}
</style>
</head>

<body>

<header id="header" class="header">
    <nav class="nav">

        <button class="logoButton" data-action="home">
            <img id="logo" class="logo" alt="GYMQFT">
        </button>

        <div class="navActions">

            <button class="iconButton" data-action="account" aria-label="Account">
                <svg class="icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 21c.8-4 3.4-6 8-6s7.2 2 8 6"/>
                </svg>
            </button>

            <button class="iconButton" data-action="favorites" aria-label="Favorites">
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M20.8 8.7c0 5.2-8.8 10-8.8 10S3.2 13.9 3.2 8.7A4.7 4.7 0 0 1 12 6a4.7 4.7 0 0 1 8.8 2.7z"/>
                </svg>
            </button>

            <button class="iconButton" data-action="cart" aria-label="Cart">
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M3 4h2l2.5 11h10L21 7H6"/>
                    <circle cx="9" cy="20" r="1"/>
                    <circle cx="18" cy="20" r="1"/>
                </svg>

                <span id="cartBadge" class="badge">0</span>
            </button>

        </div>
    </nav>
</header>

<main id="shopPage">

    <section class="shop">

        <div class="shopTop">

            <h1 class="shopTitle">
                Products
            </h1>

            <div class="filters">

                <button class="filter active" data-filter="all">
                    All
                </button>

                <button class="filter" data-filter="featured">
                    Featured
                </button>

                <button class="filter" data-filter="sale">
                    Sale
                </button>

            </div>

        </div>

        <div id="products" class="products"></div>

    </section>

</main>

<section id="page" class="page hidden"></section>

<section id="adminPage" class="admin hidden"></section>

<div id="overlay" class="overlay"></div>

<aside id="cartDrawer" class="cartDrawer">

    <div class="drawerHeader">

        <span class="drawerTitle">
            Cart
        </span>

        <button class="iconButton" data-action="close-cart">
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M6 6l12 12"/>
                <path d="M18 6L6 18"/>
            </svg>
        </button>

    </div>

    <div id="cartContent" class="drawerContent"></div>

    <div class="drawerBottom">

        <div class="totalLine">
            <span>Total</span>
            <strong id="cartTotal">$0.00</strong>
        </div>

        <button class="primary" data-action="checkout">

            <svg class="icon" viewBox="0 0 24 24">
                <path d="M3 4h2l2.5 11h10L21 7H6"/>
                <circle cx="9" cy="20" r="1"/>
                <circle cx="18" cy="20" r="1"/>
            </svg>

            Buy

        </button>

    </div>

</aside>

<div id="modalLayer" class="modalLayer">
    <div id="modal" class="modal"></div>
</div>

<div id="toast" class="toast"></div>

<footer>
    GYMQFT
</footer>

<script>

/* =====================================================
   CONFIG
===================================================== */

const ADMIN_EMAIL = "lucabryx4111@gmail.com";
const ADMIN_PASSWORD = "GYMQFT-ADMIN-2026";

/*
    Version number.

    On the first launch of this corrected version,
    old demo products are removed once.

    After that, products created by the admin
    stay saved normally.
*/
const STORE_VERSION = "3";


/* =====================================================
   DEFAULT LOGO
===================================================== */

/* =====================================================

===================================================== */

function loadJSON(key, fallback){

    try{

        const raw =
            localStorage.getItem(key);

        if(raw === null)
            return fallback;

        const parsed =
            JSON.parse(raw);

        return parsed ?? fallback;

    }catch(error){

        console.warn(
            "Could not read storage:",
            key,
            error
        );

        return fallback;

    }

}

/* =====================================================
   SAVE
===================================================== */

function saveAll(){

    try{

        localStorage.setItem(
            "gymqft_users",
            JSON.stringify(users)
        );

        localStorage.setItem(
            "gymqft_products",
            JSON.stringify(products)
        );

        localStorage.setItem(
            "gymqft_cart",
            JSON.stringify(cart)
        );

        localStorage.setItem(
            "gymqft_favorites",
            JSON.stringify(favorites)
        );

        localStorage.setItem(
            "gymqft_orders",
            JSON.stringify(orders)
        );

        if(currentUser){

            localStorage.setItem(
                "gymqft_current",
                JSON.stringify(currentUser)
            );

        }else{

            localStorage.removeItem(
                "gymqft_current"
            );

        }

    }catch(error){

        console.error(
            "Storage error:",
            error
        );

        showToast(
            "Storage limit reached"
        );

    }

}

function money(value){

    return "$" +
        Number(value || 0)
        .toFixed(2);

}


function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}

let toastTimer = null;

    toast.textContent =

        "show"

/* =====================================================
   PRODUCT LOOKUP
===================================================== */

function findProduct(id){

    return products.find(
        product =>
            String(product.id) ===
            String(id)
    ) || null;

}


/* =====================================================
   CART NORMALIZATION
===================================================== */

function normalizeCart(){

    if(!Array.isArray(cart))
        cart = [];


    const normalized = [];


    for(const item of cart){

        if(!item)
            continue;


        const id =
            String(item.id);


        const product =
            findProduct(id);


        if(!product)
            continue;


        const quantity =
            Math.max(
                1,
                parseInt(
                    item.quantity,
                    10
                ) || 1
            );


        const existing =
            normalized.find(
                x =>
                    String(x.id) === id
            );


        if(existing){

            existing.quantity +=
                quantity;

        }else{

            normalized.push({

                id:product.id,

                quantity:quantity

            });

        }

    }


    cart =
        normalized;

}


/* =====================================================
   IMPORTANT:
   GET REAL CART ITEMS
===================================================== */

function getCartItems(){

    normalizeCart();


    const result = [];


    for(const cartItem of cart){

        const product =
            findProduct(
                cartItem.id
            );


        if(!product)
            continue;


        const quantity =
            Math.max(
                1,
                parseInt(
                    cartItem.quantity,
                    10
                ) || 1
            );


        result.push({

            product:product,

            quantity:quantity,

            lineTotal:
                Number(product.price || 0) *
                quantity

        });

    }


    return result;

}


/* =====================================================
   CART
===================================================== */

function addToCart(id){

    const product =
        findProduct(id);


    if(!product){

        showToast(
            "Product not found"
        );

        return;

    }


    normalizeCart();


    const existing =
        cart.find(
            item =>
                String(item.id) ===
                String(product.id)
        );


    if(existing){

        existing.quantity =
            Number(existing.quantity || 0) +
            1;

    }else{

        cart.push({

            id:product.id,

            quantity:1

        });

    }


    saveAll();

    renderCart();

    updateHeader();

    showToast(
        "Added to cart"
    );

}


function changeQuantity(
    id,
    change
){

    normalizeCart();


    const item =
        cart.find(
            x =>
                String(x.id) ===
                String(id)
        );


    if(!item){

        showToast(
            "Cart item not found"
        );

        return;

    }


    item.quantity =
        Number(item.quantity || 0) +
        Number(change);


    if(item.quantity <= 0){

        cart =
            cart.filter(
                x =>
                    String(x.id) !==
                    String(id)
            );

    }


    saveAll();

    renderCart();

    updateHeader();

}


function removeFromCart(id){

    const oldLength =
        cart.length;


    cart =
        cart.filter(
            item =>
                String(item.id) !==
                String(id)
        );


    if(
        cart.length ===
        oldLength
    ){

        showToast(
            "Item not found in cart"
        );

        return;

    }


    saveAll();

    renderCart();

    updateHeader();

    showToast(
        "Item removed"
    );

}

/* =====================================================
   HEADER COUNT
===================================================== */

function updateHeader(){

    normalizeCart();


    const count =
        cart.reduce(
            (
                total,
                item
            ) =>
                total +
                (
                    Number(
                        item.quantity
                    ) || 0
                ),
            0
        );


    document
        .getElementById(
            "cartBadge"
        )
        .textContent =
        count;

}

function toggleFavorite(id){

    const index =
        favorites.findIndex(
            favoriteId =>
                String(favoriteId) ===
                String(id)
        );


    if(index !== -1){

        favorites.splice(
            index,
            1
        );

        showToast(
            "Removed from favorites"
        );

    }else{

        const product =
            findProduct(id);


        if(!product)
            return;


        favorites.push(
            product.id
        );

        showToast(
            "Added to favorites"
        );

    }


    saveAll();

    renderProducts(
        currentFilter
    );

}

/* =====================================================
   AUTH
===================================================== */

async function hashPassword(
    password
){

    const data =
        new TextEncoder()
        .encode(password);


    const hash =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );


    return Array.from(
        new Uint8Array(hash)
    )
    .map(
        byte =>
            byte
            .toString(16)
            .padStart(2,"0")
    )
    .join("");

}


async function handleLogin(){

    const emailInput =
        document.getElementById(
            "loginEmail"
        );

    const passwordInput =
        document.getElementById(
            "loginPassword"
        );


    if(!emailInput || !passwordInput)
        return;


    const email =
        emailInput.value
        .trim()
        .toLowerCase();


    const password =
        passwordInput.value;


    if(
        email ===
        ADMIN_EMAIL.toLowerCase()
        &&
        password ===
        ADMIN_PASSWORD
    ){

        currentUser = {

            name:"Administrator",

            email:ADMIN_EMAIL,

            admin:true

        };


        saveAll();

        showToast(
            "Signed in"
        );

        openAccount();

        return;

    }


    const passwordHash =
        await hashPassword(
            password
        );


    const user =
        users.find(
            u =>
                String(u.email)
                    .toLowerCase() ===
                email
                &&
                u.password ===
                passwordHash
        );


    if(!user){

        showToast(
            "Incorrect email or password"
        );

        return;

    }


    currentUser = {

        name:user.name,

        email:user.email

    };


    saveAll();

    showToast(
        "Signed in"
    );

    openAccount();

}


async function handleRegister(){

    const name =
        document
        .getElementById(
            "registerName"
        )
        .value
        .trim();


    const email =
        document
        .getElementById(
            "registerEmail"
        )
        .value
        .trim()
        .toLowerCase();


    const password =
        document
        .getElementById(
            "registerPassword"
        )
        .value;


    const password2 =
        document
        .getElementById(
            "registerPassword2"
        )
        .value;


    if(!name){

        showToast(
            "Enter your name"
        );

        return;

    }


    if(password.length < 6){

        showToast(
            "Password must contain at least 6 characters"
        );

        return;

    }


    if(password !== password2){

        showToast(
            "Passwords do not match"
        );

        return;

    }


    if(
        email ===
        ADMIN_EMAIL.toLowerCase()
    ){

        showToast(
            "This email is reserved"
        );

        return;

    }


    if(
        users.some(
            user =>
                String(user.email)
                    .toLowerCase() ===
                email
        )
    ){

        showToast(
            "Account already exists"
        );

        return;

    }


    const passwordHash =
        await hashPassword(
            password
        );


    users.push({

        id:
            Date.now(),

        name:name,

        email:email,

        password:passwordHash

    });


    currentUser = {

        name:name,

        email:email

    };


    saveAll();

    showToast(
        "Account created"
    );

    openAccount();

}


function logout(){

    currentUser =
        null;

    saveAll();

    showToast(
        "Signed out"
    );

    openAccount();

}

        currentUser &&
        currentUser.email &&

        ADMIN_EMAIL.toLowerCase()
    );

}

/* =====================================================
   PLACE ORDER
===================================================== */

function handlePlaceOrder(){

    const nameInput =
        document.getElementById(
            "checkoutName"
        );

    const emailInput =
        document.getElementById(
            "checkoutEmail"
        );


    if(!nameInput || !emailInput){

        showToast(
            "Checkout form not found"
        );

        return;

    }


    const name =
        nameInput.value
        .trim();


    const email =
        emailInput.value
        .trim()
        .toLowerCase();


    if(!name){

        showToast(
            "Enter your full name"
        );

        return;

    }


    if(
        !email ||
        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
            email
        )
    ){

        showToast(
            "Enter a valid email"
        );

        return;

    }


    /*
        THIS IS THE IMPORTANT PART.

        We read the actual cart again at the
        exact moment Place Order is pressed.
    */

    normalizeCart();

    const items =
        getCartItems();


    if(!items.length){

        renderCart();

        showToast(
            "Your cart is empty"
        );

        return;

    }


    const orderItems =
        items.map(
            item => ({

                id:item.product.id,

                name:item.product.name,

                price:Number(
                    item.product.price || 0
                ),

                quantity:item.quantity,

                image:
                    item.product.image || ""

            })
        );


    const total =
        orderItems.reduce(
            (
                sum,
                item
            ) =>
                sum +
                (
                    item.price *
                    item.quantity
                ),
            0
        );


    const order = {

        id:
            "GYM-" +
            Date.now()
            .toString(36)
            .toUpperCase(),

        date:
            new Date()
            .toISOString(),

        customer:{

            name:name,

            email:email

        },

        items:orderItems,

        total:Number(
            total.toFixed(2)
        )

    };


    /*
        Save the order FIRST.
        Only after it is saved do we empty the cart.
    */

    orders.unshift(
        order
    );


    cart = [];


    saveAll();

    updateHeader();

    renderCart();

    showOrderSuccess(
        order
    );

}

let pendingDeleteId = null;


function askDeleteProduct(
    id
){

    if(!isAdmin())
        return;


    const product =
        findProduct(id);


    if(!product){

        showToast(
            "Product not found"
        );

        return;

    }


    /*
        Store the exact product ID.
    */

    pendingDeleteId =
        String(
            product.id
        );


    const modal =
        document.getElementById(
            "modal"
        );


    modal.innerHTML = `

        <h3>
            Delete product?
        </h3>


        <p>
            "${escapeHTML(
                product.name
            )}" will be permanently removed from the store.
        </p>


        <div class="modalActions">

            <button
                class="secondary"
                data-action="cancel-delete"
                type="button">

                Cancel

            </button>


            <button
                class="dangerButton"
                style="
                    justify-content:center;
                "
                data-action="confirm-delete-product"
                type="button">

                Delete

            </button>

        </div>

    `;


    document
        .getElementById(
            "modalLayer"
        )
        .classList.add(
            "open"
        );

}


function confirmDeleteProduct(){

    if(
        pendingDeleteId === null
    ){

        closeModal();

        return;

    }


    const deleteId =
        String(
            pendingDeleteId
        );


    const exists =
        products.some(
            product =>
                String(product.id) ===
                deleteId
        );


    if(!exists){

        pendingDeleteId =
            null;

        closeModal();

        showToast(
            "Product no longer exists"
        );

        return;

    }


    /*
        DELETE FROM ALL RELEVANT DATA.
    */

    products =
        products.filter(
            product =>
                String(product.id) !==
                deleteId
        );


    favorites =
        favorites.filter(
            favoriteId =>
                String(favoriteId) !==
                deleteId
        );


    cart =
        cart.filter(
            item =>
                String(item.id) !==
                deleteId
        );


    /*
        Clear ID BEFORE rendering.
    */

    pendingDeleteId =
        null;


    saveAll();

    closeModal();

    renderProducts(
        currentFilter
    );

    renderCart();

    updateHeader();

    /*
        Re-render admin after deletion.
    */

    if(
        document
        .getElementById(
            "adminPage"
        )
        .classList.contains(
            "hidden"
        ) === false
    ){

        renderAdmin();

    }


    showToast(
        "Product deleted"
    );

}


/* =====================================================
   LOGO
===================================================== */

function uploadLogo(
    file
){

    if(!file)
        return;


    if(
        !file.type.startsWith(
            "image/"
        )
    ){

        showToast(
            "Please choose an image"
        );

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(){

            logo =
                reader.result;


            localStorage.setItem(
                "gymqft_logo",
                logo
            );


            document.getElementById(
                "logo"
            ).src =
                logo;


            renderAdmin();

            showToast(
                "Logo updated"
            );

        };


    reader.onerror =
        function(){

            showToast(
                "Could not read image"
            );

        };


    reader.readAsDataURL(
        file
    );

}

            order
        );

        return;

    }


    const script =
        document.createElement(
            "script"
        );


    script.src =
        "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";


    script.onload =
        function(){

            createPDF(
                order
            );

        };


    script.onerror =
        function(){

            showToast(
                "PDF library could not be loaded"
            );

        };


    document.head.appendChild(
        script
    );

}


function createPDF(
    order
){

    const {
        jsPDF
    } =
        window.jspdf;


    const doc =
        new jsPDF();


    doc.setFillColor(
        17,
        17,
        17
    );


    doc.rect(
        0,
        0,
        210,
        42,
        "F"
    );


    doc.setTextColor(
        255,
        255,
        255
    );


    doc.setFontSize(
        25
    );


    doc.text(
        "GYMQFT",
        20,
        27
    );


    doc.setTextColor(
        20,
        20,
        20
    );


    doc.setFontSize(
        20
    );


    doc.text(
        "ORDER RECEIPT",
        20,
        62
    );


    doc.setFontSize(
        10
    );


    doc.text(
        "Order: " +
        order.id,
        20,
        73
    );


    doc.text(
        "Date: " +
        new Date(
            order.date
        ).toLocaleString(),
        20,
        81
    );


    doc.text(
        "Customer: " +
        order.customer.name,
        20,
        95
    );


    doc.text(
        "Email: " +
        order.customer.email,
        20,
        103
    );


    let y = 122;


    order.items.forEach(
        item => {

            doc.text(
                item.name +
                " x" +
                item.quantity,
                20,
                y
            );


            doc.text(
                money(
                    item.price *
                    item.quantity
                ),
                165,
                y
            );


            y += 10;

        }
    );


    doc.line(
        20,
        y + 5,
        190,
        y + 5
    );


    doc.setFontSize(
        15
    );


    doc.text(
        "TOTAL",
        20,
        y + 18
    );


    doc.text(
        money(
            order.total
        ),
        165,
        y + 18
    );


    doc.setFontSize(
        9
    );


    doc.setTextColor(
        120,
        120,
        120
    );


    doc.text(
        "Thank you for your order.",
        20,
        y + 38
    );


    doc.save(
        order.id +
        "-receipt.pdf"
    );

}


/* =====================================================
   MODAL
===================================================== */

function closeModal(){

    document
        .getElementById(
            "modalLayer"
        )
        .classList.remove(
            "open"
        );

    pendingDeleteId =
        null;

}


/* =====================================================
   CENTRAL ACTION HANDLER
===================================================== */

document.addEventListener(
    "click",
    function(event){

        const button =
            event.target.closest(
                "[data-action]"
            );


        if(!button)
            return;


        const action =
            button.dataset.action;


        const id =
            button.dataset.id;


        switch(action){

            case "home":

                goHome();

                break;


            case "account":

                openAccount();

                break;


            case "favorites":

                openFavorites();

                break;


            case "cart":

                if(
                    document
                    .getElementById(
                        "cartDrawer"
                    )
                    .classList.contains(
                        "open"
                    )
                ){

                    closeCart();

                }else{

                    openCart();

                }

                break;


            case "close-cart":

                closeCart();

                break;


            case "add-cart":

                addToCart(id);

                break;


            case "quantity":

                changeQuantity(
                    id,
                    Number(
                        button.dataset.change
                    )
                );

                break;


            case "remove-cart":

                removeFromCart(id);

                break;


            case "favorite":

                toggleFavorite(id);

                break;


            case "checkout":

                openCheckout();

                break;


            case "register-view":

                renderRegister();

                break;


            case "login-view":

                renderLogin();

                break;


            case "logout":

                logout();

                break;


            case "admin":

                openAdmin();

                break;


            case "new-product":

                renderNewProduct();

                break;


            case "edit-product":

                renderEditProduct(id);

                break;


            case "delete-product":

                askDeleteProduct(id);

                break;


            /*
                NEW, UNIQUE DELETE CONFIRM ACTION.
            */

            case "confirm-delete-product":

                confirmDeleteProduct();

                break;


            case "cancel-delete":

                closeModal();

                break;


            case "close-modal":

                closeModal();

                break;


            case "download-receipt":

                downloadReceipt(
                    button.dataset.orderId
                );

                break;

    }
);

document.addEventListener(

            );

        );

/* =====================================================
   FORMS
===================================================== */

document.addEventListener(
    "submit",
    async function(event){

        const form =
            event.target;


        if(!form)
            return;


        /*
            Prevent the browser from navigating away.
        */

        event.preventDefault();


        /* LOGIN */

        if(
            form.id ===
            "loginForm"
        ){

            await handleLogin();

            return;

        }


        /* REGISTER */

        if(
            form.id ===
            "registerForm"
        ){

            await handleRegister();

            return;

        }


        /* CHECKOUT */

        if(
            form.id ===
            "checkoutForm"
        ){

            handlePlaceOrder();

            return;

        }


        /* NEW PRODUCT */

        if(
            form.id ===
            "newProductForm"
        ){

            await createProductFromForm(
                form
            );

            return;

        }


        /* EDIT PRODUCT */

        if(
            form.id ===
            "editProductForm"
        ){

            await editProductFromForm(
                form
            );

            return;

        }

    }
);


/* =====================================================
   CREATE PRODUCT
===================================================== */

function createProductFromForm(
    form
){

    if(!isAdmin())
        return;


    const name =
        document
        .getElementById(
            "newName"
        )
        .value
        .trim();


    const description =
        document
        .getElementById(
            "newDescription"
        )
        .value
        .trim();


    const price =
        Number(
            document
            .getElementById(
                "newPrice"
            )
            .value
        );


    const oldPrice =
        Number(
            document
            .getElementById(
                "newOldPrice"
            )
            .value
        ) || null;


    const category =
        document
        .getElementById(
            "newCategory"
        )
        .value;


    const file =
        document
        .getElementById(
            "newImage"
        )
        .files[0];


    if(!name){

        showToast(
            "Enter a product name"
        );

        return;

    }


    if(
        !Number.isFinite(price) ||
        price < 0
    ){

        showToast(
            "Enter a valid price"
        );

        return;

    }


    if(!file){

        showToast(
            "Choose a product image"
        );

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(){

            const product = {

                id:
                    "product-" +
                    Date.now() +
                    "-" +
                    Math.random()
                    .toString(36)
                    .slice(2),

                name:name,

                description:description,

                price:price,

                oldPrice:oldPrice,

                category:category,

                image:reader.result

            };


            products.push(
                product
            );


            saveAll();

            renderProducts(
                currentFilter
            );

            renderAdmin();

            showToast(
                "Product created"
            );

        };


    reader.onerror =
        function(){

            showToast(
                "Could not read image"
            );

        };


    reader.readAsDataURL(
        file
    );

}


/* =====================================================
   EDIT PRODUCT
===================================================== */

function editProductFromForm(
    form
){

    if(!isAdmin())
        return;


    const id =
        String(
            form.dataset.id
        );


    const product =
        findProduct(id);


    if(!product){

        showToast(
            "Product not found"
        );

        return;

    }


    product.name =
        document
        .getElementById(
            "editName"
        )
        .value
        .trim();


    product.description =
        document
        .getElementById(
            "editDescription"
        )
        .value
        .trim();


    product.price =
        Number(
            document
            .getElementById(
                "editPrice"
            )
            .value
        );


    product.oldPrice =
        Number(
            document
            .getElementById(
                "editOldPrice"
            )
            .value
        ) || null;


    product.category =
        document
        .getElementById(
            "editCategory"
        )
        .value;


    const file =
        document
        .getElementById(
            "editImage"
        )
        .files[0];


    if(file){

        const reader =
            new FileReader();


        reader.onload =
            function(){

                product.image =
                    reader.result;


                finishProductEdit();

            };


        reader.onerror =
            function(){

                showToast(
                    "Could not read image"
                );

            };


        reader.readAsDataURL(
            file
        );

    }else{

        finishProductEdit();

    }

}


function finishProductEdit(){

    saveAll();

    renderProducts(
        currentFilter
    );

    renderAdmin();

    showToast(
        "Product updated"
    );

}

<script>
/* =====================================================
   GYMQFT - ADDITIONS ONLY
===================================================== */

let shopOpen =
    localStorage.getItem("gymqft_shop_open") !== "false";

let discountCodes =
    loadJSON("gymqft_discount_codes", []);

let appliedDiscountCode = null;


/* ---------- CLOSED SHOP SCREEN ---------- */

function ensureClosedShopScreen(){
    let screen = document.getElementById("shopClosedScreen");

    if(screen) return screen;

    screen = document.createElement("div");
    screen.id = "shopClosedScreen";
    screen.className = "shopClosedScreen hidden";

    screen.innerHTML = `
        <div class="shopClosedCard">
            <img id="closedShopLogo" class="closedShopLogo" alt="GYMQFT">
            <h1>Shop is currently closed</h1>
            <p>The shop is temporarily unavailable. You can still sign in or create an account.</p>
            <button class="primary" data-action="account" type="button">
                Account
            </button>
        </div>
    `;

    document.body.appendChild(screen);
    return screen;
}

function updateShopVisibility(){
    const screen = ensureClosedShopScreen();

    const closed =
        !shopOpen &&
        !isAdmin() &&
        document.getElementById("page").classList.contains("hidden");

    screen.classList.toggle("hidden", !closed);

    const closedLogo =
        document.getElementById("closedShopLogo");

    if(closedLogo){
        closedLogo.src =
            localStorage.getItem("gymqft_logo") ||
            logo ||
            DEFAULT_LOGO;
    }
}


/* ---------- DISCOUNT CODES ---------- */

function normalizeDiscountCode(value){
    return String(value || "").trim().toUpperCase();
}

function findDiscountCode(code){
    const normalized = normalizeDiscountCode(code);

    return discountCodes.find(item =>
        normalizeDiscountCode(item.code) === normalized
    ) || null;
}

function getDiscountUsageForCustomer(code, email){
    if(!email) return 0;

    const normalized =
        normalizeDiscountCode(code);

    return orders.reduce((count, order) => {

        if(!order || !order.discount)
            return count;

        if(
            normalizeDiscountCode(order.discount.code) !==
            normalized
        )
            return count;

        const orderEmail =
            order.customer?.email ||
            order.email ||
            "";

        if(
            String(orderEmail).toLowerCase() !==
            String(email).toLowerCase()
        )
            return count;

        return count + 1;

    },0);
}

function validateDiscountCode(code, subtotal, email){
    const discount =
        findDiscountCode(code);

    if(!discount)
        return {
            ok:false,
            message:"Invalid discount code"
        };

    if(discount.expiresAt){

        const expiry =
            new Date(
                discount.expiresAt +
                "T23:59:59"
            );

        if(
            !Number.isNaN(expiry.getTime()) &&
            new Date() > expiry
        ){
            return {
                ok:false,
                message:"This discount code has expired"
            };
        }
    }

    const minimum =
        Number(discount.minSubtotal || 0);

    if(subtotal < minimum){
        return {
            ok:false,
            message:
                "Minimum order value is " +
                money(minimum)
        };
    }

    const limit =
        Number(discount.usageLimit || 0);

    if(limit > 0){

        const used =
            getDiscountUsageForCustomer(
                discount.code,
                email || currentUser?.email || ""
            );

        if(used >= limit){
            return {
                ok:false,
                message:
                    "You have reached the usage limit for this code"
            };
        }
    }

    return {
        ok:true,
        discount
    };
}

function getCartTotalsWithDiscount(){

    const items =
        getCartItems();

    const subtotal =
        items.reduce(
            (sum,item) =>
                sum + item.lineTotal,
            0
        );

    let discountAmount = 0;
    let discount = null;

    if(appliedDiscountCode){

        const result =
            validateDiscountCode(
                appliedDiscountCode.code,
                subtotal,
                currentUser?.email || ""
            );

        if(result.ok){

            discount =
                result.discount;

            if(discount.type === "percent"){

                discountAmount =
                    subtotal *
                    (
                        Number(discount.value || 0) /
                        100
                    );

            }else{

                discountAmount =
                    Number(
                        discount.value || 0
                    );

            }

            discountAmount =
                Math.min(
                    subtotal,
                    Math.max(
                        0,
                        discountAmount
                    )
                );

        }else{

            appliedDiscountCode = null;
        }
    }

    return {
        items,
        subtotal,
        discountAmount,
        discount,
        total:
            Math.max(
                0,
                subtotal - discountAmount
            )
    };
}

function applyDiscountCode(){

    const input =
        document.getElementById(
            "discountCodeInput"
        );

    if(!input)
        return;

    const code =
        normalizeDiscountCode(
            input.value
        );

    if(!code){
        showToast("Enter a discount code");
        return;
    }

    const totals =
        getCartTotalsWithDiscount();

    const result =
        validateDiscountCode(
            code,
            totals.subtotal,
            currentUser?.email || ""
        );

    if(!result.ok){
        showToast(result.message);
        return;
    }

    appliedDiscountCode =
        result.discount;

    renderCart();

    showToast(
        "Discount code applied"
    );
}

function removeDiscountCode(){

    appliedDiscountCode = null;

    renderCart();

    showToast(
        "Discount code removed"
    );
}

                        }">

                    <button
                        data-action="apply-discount"
                        type="button">
                        Apply
                    </button>

                </div>

                ${
                    totals.discount
                    ?
                    `
                    <div class="discountApplied">

                        <span>
                            ${escapeHTML(
                                totals.discount.code
                            )}
                            ·
                            ${
                                totals.discount.type ===
                                "percent"
                                ?
                                Number(
                                    totals.discount.value
                                ) + "%"
                                :
                                money(
                                    totals.discount.value
                                )
                            }
                        </span>

                        <button
                            class="smallButton"
                            data-action="remove-discount"
                            type="button">
                            Remove
                        </button>

                    </div>
                    `
                    :
                    ""
                }

            </div>

                        -${money(

                :

            <div class="totalLine">

            <button
                class="primary"
                data-action="checkout"
                ${
                    !items.length
                    ? "disabled"
                    : ""

/* ---------- ORDER OVERRIDE ---------- */

const originalHandlePlaceOrder =
    handlePlaceOrder;

handlePlaceOrder = function(){

    if(
        !shopOpen &&
        !isAdmin()
    ){
        showToast(
            "The shop is currently closed"
        );
        openAccount();
        return;
    }

    const nameInput =
        document.getElementById(
            "checkoutName"
        );

    const emailInput =
        document.getElementById(
            "checkoutEmail"
        );

    if(!nameInput || !emailInput){
        showToast(
            "Checkout form not found"
        );
        return;
    }

    const name =
        nameInput.value.trim();

    const email =
        emailInput.value.trim().toLowerCase();

    if(!name){
        showToast(
            "Enter your full name"
        );
        return;
    }

    if(
        !email ||
        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
            email
        )
    ){
        showToast(
            "Enter a valid email"
        );
        return;
    }

    const totals =
        getCartTotalsWithDiscount();

    if(!totals.items.length){
        showToast(
            "Your cart is empty"
        );
        return;
    }

    /*
       Validate once more at the exact moment
       the order is placed.
    */
    if(totals.discount){

        const check =
            validateDiscountCode(
                totals.discount.code,
                totals.subtotal,
                email
            );

        if(!check.ok){
            appliedDiscountCode = null;
            renderCart();
            showToast(
                check.message
            );
            return;
        }
    }

    const orderItems =
        totals.items.map(
            item => ({

                id:
                    item.product.id,

                name:
                    item.product.name,

                price:
                    Number(
                        item.product.price || 0
                    ),

                quantity:
                    item.quantity,

                image:
                    item.product.image || ""

            })
        );

    const order = {

        id:
            "GYM-" +
            Date.now()
            .toString(36)
            .toUpperCase(),

        date:
            new Date()
            .toISOString(),

        customer:{
            name,
            email
        },

        items:
            orderItems,

        subtotal:
            Number(
                totals.subtotal.toFixed(2)
            ),

        discount:
            totals.discount
            ?
            {
                code:
                    totals.discount.code,

                type:
                    totals.discount.type,

                value:
                    Number(
                        totals.discount.value
                    ),

                amount:
                    Number(
                        totals.discountAmount
                        .toFixed(2)
                    )
            }
            :
            null,

        total:
            Number(
                totals.total.toFixed(2)
            )
    };

    orders.unshift(order);

    cart = [];
    appliedDiscountCode = null;

    saveAll();
    updateHeader();
    renderCart();
    showOrderSuccess(order);
};

/* ---------- LOGO ON RECEIPT ---------- */

function rasterizeLogoForPDF(dataUrl){

    return new Promise(
        (resolve,reject) => {

            if(!dataUrl){
                reject(
                    new Error("No logo")
                );
                return;
            }

            const img =
                new Image();

            img.onload =
                function(){

                    const width =
                        img.naturalWidth ||
                        img.width ||
                        600;

                    const height =
                        img.naturalHeight ||
                        img.height ||
                        180;

                    const scale =
                        Math.min(
                            1,
                            1000 /
                            Math.max(
                                width,
                                height
                            )
                        );

                    const canvas =
                        document.createElement(
                            "canvas"
                        );

                    canvas.width =
                        Math.max(
                            1,
                            Math.round(
                                width * scale
                            )
                        );

                    canvas.height =
                        Math.max(
                            1,
                            Math.round(
                                height * scale
                            )
                        );

                    const ctx =
                        canvas.getContext(
                            "2d"
                        );

                    ctx.fillStyle =
                        "#ffffff";

                    ctx.fillRect(
                        0,
                        0,
                        canvas.width,
                        canvas.height
                    );

                    ctx.drawImage(
                        img,
                        0,
                        0,
                        canvas.width,
                        canvas.height
                    );

                    resolve({
                        dataUrl:
                            canvas.toDataURL(
                                "image/png"
                            ),
                        width:
                            canvas.width,
                        height:
                            canvas.height
                    });
                };

            img.onerror =
                function(){
                    reject(
                        new Error(
                            "Could not load logo"
                        )
                    );
                };

            img.src =
                dataUrl;
        }
    );
}


/*
   Override only the PDF creation.
   It automatically uses the existing
   gymqft_logo from localStorage.
*/
createPDF = async function(order){

    const {
        jsPDF
    } =
        window.jspdf;

    const doc =
        new jsPDF();

    const storedLogo =
        localStorage.getItem(
            "gymqft_logo"
        ) ||
        logo ||
        DEFAULT_LOGO;

    doc.setFillColor(
        17,
        17,
        17
    );

    doc.rect(
        0,
        0,
        210,
        44,
        "F"
    );

    try{

        const image =
            await rasterizeLogoForPDF(
                storedLogo
            );

        const maxWidth = 62;
        const maxHeight = 28;

        const scale =
            Math.min(
                maxWidth / image.width,
                maxHeight / image.height
            );

        const w =
            image.width * scale;

        const h =
            image.height * scale;

        const x = 20;
        const y = 22 - h / 2;

        doc.setFillColor(
            255,
            255,
            255
        );

        doc.roundedRect(
            x - 3,
            y - 3,
            w + 6,
            h + 6,
            3,
            3,
            "F"
        );

        doc.addImage(
            image.dataUrl,
            "PNG",
            x,
            y,
            w,
            h,
            undefined,
            "FAST"
        );

    }catch(error){

        doc.setTextColor(
            255,
            255,
            255
        );

        doc.setFontSize(
            25
        );

        doc.text(
            "GYMQFT",
            20,
            27
        );
    }

    doc.setTextColor(
        20,
        20,
        20
    );

    doc.setFontSize(
        20
    );

    doc.text(
        "ORDER RECEIPT",
        20,
        62
    );

    doc.setFontSize(
        10
    );

    doc.text(
        "Order: " +
        order.id,
        20,
        73
    );

    doc.text(
        "Date: " +
        new Date(
            order.date
        ).toLocaleString(),
        20,
        81
    );

    doc.text(
        "Customer: " +
        order.customer.name,
        20,
        95
    );

    doc.text(
        "Email: " +
        order.customer.email,
        20,
        103
    );

    let y = 119;

    doc.setFontSize(
        11
    );

    for(
        const item of
        (order.items || [])
    ){

        doc.text(
            item.name +
            " x" +
            item.quantity,
            20,
            y
        );

        doc.text(
            money(
                Number(item.price) *
                Number(item.quantity)
            ),
            175,
            y,
            {
                align:"right"
            }
        );

        y += 8;

        if(y > 260){

            doc.addPage();

            y = 25;
        }
    }

    y += 7;

    doc.setDrawColor(
        220,
        220,
        220
    );

    doc.line(
        20,
        y,
        190,
        y
    );

    y += 10;

    doc.setTextColor(
        90,
        90,
        90
    );

    doc.text(
        "Subtotal",
        20,
        y
    );

    doc.text(
        money(
            order.subtotal ??
            order.total
        ),
        175,
        y,
        {
            align:"right"
        }
    );

    if(order.discount){

        y += 8;

        doc.setTextColor(
            20,
            120,
            60
        );

        doc.text(
            "Discount (" +
            order.discount.code +
            ")",
            20,
            y
        );

        doc.text(
            "-" +
            money(
                order.discount.amount
            ),
            175,
            y,
            {
                align:"right"
            }
        );
    }

    y += 10;

    doc.setTextColor(
        20,
        20,
        20
    );

    doc.setFontSize(
        13
    );

    doc.text(
        "Total",
        20,
        y
    );

    doc.text(
        money(
            order.total
        ),
        175,
        y,
        {
            align:"right"
        }
    );

    doc.setFontSize(
        10
    );

    doc.setTextColor(
        120,
        120,
        120
    );

    doc.text(
        "Thank you for your order.",
        20,
        y + 18
    );

    doc.save(
        order.id +
        "-receipt.pdf"
    );
};

/* ---------- DISCOUNT FORM ---------- */

document.addEventListener(
    "submit",
    function(event){

        const form =
            event.target;

        if(
            !form ||
            form.id !==
            "discountCodeForm"
        )
            return;

        event.preventDefault();

        if(!isAdmin())
            return;

        const code =
            normalizeDiscountCode(
                document.getElementById(
                    "discountCodeName"
                ).value
            );

        const type =
            document.getElementById(
                "discountCodeType"
            ).value;

        const value =
            Number(
                document.getElementById(
                    "discountCodeValue"
                ).value
            );

        const expiresAt =
            document.getElementById(
                "discountCodeExpiry"
            ).value;

        const minSubtotal =
            Number(
                document.getElementById(
                    "discountCodeMinimum"
                ).value
            ) || 0;

        const usageLimit =
            Number(
                document.getElementById(
                    "discountCodeUsageLimit"
                ).value
            ) || 0;

        if(!code){
            showToast(
                "Enter a discount code"
            );
            return;
        }

        if(
            !/^[A-Z0-9_-]{2,40}$/.test(
                code
            )
        ){
            showToast(
                "Use 2-40 letters, numbers, - or _"
            );
            return;
        }

        if(findDiscountCode(code)){
            showToast(
                "This discount code already exists"
            );
            return;
        }

        if(
            !Number.isFinite(value) ||
            value <= 0
        ){
            showToast(
                "Enter a valid discount value"
            );
            return;
        }

        if(
            type === "percent" &&
            value > 100
        ){
            showToast(
                "Percentage cannot exceed 100%"
            );
            return;
        }

        discountCodes.push({

            id:
                "discount-" +
                Date.now() +
                "-" +
                Math.random()
                .toString(36)
                .slice(2,8),

            code,
            type,
            value,
            expiresAt,
            minSubtotal,
            usageLimit,

            createdAt:
                new Date()
                .toISOString()
        });

        localStorage.setItem(
            "gymqft_discount_codes",
            JSON.stringify(
                discountCodes
            )
        );

        renderAdminSection(
            "discounts"
        );

        showToast(
            "Discount code created"
        );
    }
);
